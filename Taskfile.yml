version: '3'

tasks:
  install-deps:
    desc: Install dependencies to ./bin if missing
    cmds:
      - { task: install-lint }
      - { task: install-oapi-gen }
      - { task: install-mockery }
      - { task: install-goose }

  install-lint:
    desc: Install golangci-lint to ./bin if missing
    cmds:
      - mkdir -p bin
      - |
        if [ ! -x ./bin/golangci-lint ]; then
          GOBIN="$(pwd)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
        fi

  install-oapi-gen:
    desc: Install oapi-codegen to ./bin if missing
    cmds:
      - mkdir -p bin
      - |
        if [ ! -x ./bin/oapi-codegen ]; then
          GOBIN="$(pwd)/bin" go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.1
        fi

  install-goose:
    desc: Install goose to ./bin if missing
    cmds:
      - mkdir -p bin
      - |
        if [ ! -x ./bin/goose ]; then
          GOBIN="$(pwd)/bin" go install github.com/pressly/goose/v3/cmd/goose@v3.27.0
        fi

  install-mockery:
    desc: Install mockery to ./bin if missing
    cmds:
      - mkdir -p bin
      - |
        if [ ! -x ./bin/mockery ]; then
          GOBIN="$(pwd)/bin" go install github.com/vektra/mockery/v2@v2.52.4
        fi

  lint:
    desc: Run linter
    deps:
      - install-lint
    cmds:
      - ./bin/golangci-lint run

  gen-api:
    desc: Generate OpenAPI models and server
    deps:
      - install-oapi-gen
    cmds:
      - mkdir -p internal/api
      - ./bin/oapi-codegen -config spec/openapi/oapi-codegen.types.yaml spec/openapi/users.yaml
      - ./bin/oapi-codegen -config spec/openapi/oapi-codegen.server.yaml spec/openapi/users.yaml

  gen-mocks:
    desc: Generate mocks
    deps:
      - install-mockery
    cmds:
      - ./bin/mockery --config mockery.yaml

  check-generated:
    desc: Verify generated files are up to date
    cmds:
      - { task: gen-api }
      - git diff --exit-code -- internal/api/*.gen.go

  unit-test:
    desc: Run unit tests
    cmds:
      - go test -cover ./internal/service/... ./internal/domain/... ./internal/infra/...

  api-test:
    desc: Run contracts test
    cmds:
      - go test -v ./tests/...

  integration-test:
    desc: Run repo tests
    cmds:
      - go test -v ./internal/repository/...

  check:
    desc: Check stability
    cmds:
      - { task: check-generated }
      - { task: lint }
      - { task: unit-test }
      - { task: integration-test }
      - { task: api-test }
      - { task: build }

  run:
    desc: Run application
    deps:
      - build
    cmds:
      - ./bin/auth

  build:
    desc: Build application
    cmds:
      - go build -o ./bin/auth cmd/auth/main.go


  docker-run:
    desc: Run application in docker
    cmds:
      - |
        set -a
        . ./.env
        set +a
        VERSION=${VERSION} COMMIT_SHA=$(git rev-parse --short HEAD) BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) docker compose up --build --force-recreate -d auth

  migrate-up:
    desc: Apply goose migrations
    deps:
      - install-goose
    cmds:
      - |
        set -a
        . ./.env
        set +a
        ./bin/goose -dir ./migration/auth postgres "host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=${DB_DATABASE} sslmode=${DB_SSLMODE}" up

  migrate-down:
    desc: Rollback goose migration
    deps:
      - install-goose
    cmds:
      - |
        set -a
        . ./.env
        set +a
        ./bin/goose -dir ./migration/auth postgres "host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=${DB_DATABASE} sslmode=${DB_SSLMODE}" down
