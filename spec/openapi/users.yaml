openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
  description: API для регистрации, логина, логаута и получения пользователя.

tags:
  - name: Users
    description: Операции с пользователями

paths:
  /users/register:
    post:
      tags: [Users]
      summary: Регистрация пользователя
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/login:
    post:
      tags: [Users]
      summary: Вход в систему
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie:
              description: session_id cookie
              schema:
                type: string
                example: session_id=abc123; Path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}/logout:
    post:
      tags: [Users]
      summary: Выход из системы
      operationId: logoutUser
      security:
        - SessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      tags: [Users]
      summary: Получение информации о пользователе по id
      operationId: getUserById
      security:
        - SessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: session_id

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: ID пользователя
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    RegisterRequest:
      type: object
      required:
        - login
        - password
        - name
        - last_name
      properties:
        login:
          type: string
          description: Логин (латиница)
          maxLength: 255
        password:
          type: string
          description: Пароль пользователя
          minLength: 1
        name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50

    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          maxLength: 255
        password:
          type: string
          minLength: 1

    UserResponse:
      type: object
      required:
        - id
        - login
        - name
        - last_name
        - created_at
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        last_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
          example: Validation failed
